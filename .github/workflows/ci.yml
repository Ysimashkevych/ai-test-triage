name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test   # fully offline: MockLLM only, no API key needed
      - run: npm run build
      - name: Smoke test CLI (heuristics only, no network)
        run: node dist/cli.js fixtures/checkout-report.json --out-dir triage-out
